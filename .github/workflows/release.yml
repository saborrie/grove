name: release

# The publishing half of a release. ci.yml cuts the tag once the tests are
# green and then calls this with the version it derived — see the comment on
# the `tag` job there for why the publish cannot be a tag-triggered workflow of
# its own.
#
# The `push: tags:` trigger is the manual escape hatch: push a tag by hand and
# the same publish runs, which is what you want when a release needs redoing.
on:
  workflow_call:
    inputs:
      version:
        description: The version to publish, e.g. 0.2.0
        required: true
        type: string
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Called with a version, or triggered by a tag that *is* the version. Defined
  # once here so every job below can read it without output plumbing.
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  # Made once, as a draft, so the release only becomes visible if every binary
  # built. A half-populated release is worse than a late one.
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Create the draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$VERSION" --draft --verify-tag --title "$VERSION" --generate-notes

  build-release:
    name: Build ${{ matrix.target }}
    needs: [create-release]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # musl, so one binary runs on any Linux regardless of its glibc. grove has
      # no C dependencies, so this needs no cross toolchain.
      #
      # GROVE_VERSION is what `grove --version` reports: nothing in Cargo.toml
      # carries a version, so the tag reaches the binary through here or not at
      # all.
      - name: Build
        run: GROVE_VERSION="$VERSION" cargo build --release --target ${{ matrix.target }}

      # Cheap guard against the injection silently not happening — a release
      # whose binaries all answer "dev" would otherwise ship unnoticed.
      - name: Check the binary knows its version
        run: |
          built="$(./target/${{ matrix.target }}/release/grove --version)"
          if [ "$built" != "grove $VERSION" ]; then
            echo "built binary reports '$built', expected 'grove $VERSION'" >&2
            exit 1
          fi

      - name: Package
        run: |
          staging="grove-$VERSION-${{ matrix.target }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/grove" "$staging/"
          cp README.md LICENSE "$staging/"
          tar czf "$staging.tar.gz" "$staging"
          sha256sum "$staging.tar.gz" > "$staging.tar.gz.sha256"
          echo "ASSET=$staging.tar.gz" >> "$GITHUB_ENV"

      - name: Upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$VERSION" "$ASSET" "$ASSET.sha256"

  publish:
    name: Publish
    needs: [create-release, build-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Undraft the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$VERSION" --draft=false --latest
