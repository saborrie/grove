name: release

# Releases are cut by pushing a tag that matches the version in Cargo.toml —
# the ripgrep model. Cargo.toml is the source of truth; the tag just says
# "this commit is that version". Nothing is published from a branch push, so
# main is never one merge away from an accidental release.
#
#   1. bump `version` in Cargo.toml, commit
#   2. git tag 0.2.0 && git push origin 0.2.0
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Made once, as a draft, so the release only becomes visible if every binary
  # built. A half-populated release is worse than a late one.
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ env.VERSION }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the version from the tag
        run: echo "VERSION=${{ github.ref_name }}" >> "$GITHUB_ENV"

      - name: Check the tag matches Cargo.toml
        run: |
          cargo_version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          if [ "$cargo_version" != "$VERSION" ]; then
            echo "tag $VERSION does not match Cargo.toml version $cargo_version" >&2
            exit 1
          fi

      - name: Create the draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$VERSION" --draft --verify-tag --title "$VERSION" --generate-notes

  build-release:
    name: Build ${{ matrix.target }}
    needs: [create-release]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # musl, so one binary runs on any Linux regardless of its glibc. grove has
      # no C dependencies, so this needs no cross toolchain.
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          staging="grove-$VERSION-${{ matrix.target }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/grove" "$staging/"
          cp README.md LICENSE "$staging/"
          tar czf "$staging.tar.gz" "$staging"
          sha256sum "$staging.tar.gz" > "$staging.tar.gz.sha256"
          echo "ASSET=$staging.tar.gz" >> "$GITHUB_ENV"

      - name: Upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: gh release upload "$VERSION" "$ASSET" "$ASSET.sha256"

  publish:
    name: Publish
    needs: [create-release, build-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Undraft the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: gh release edit "$VERSION" --draft=false --latest
