[package]
name = "grove"
# No `version`: grove is not published to crates.io, and the git tag is the only
# thing that says which release a build is. Cargo defaults this to 0.0.0, and
# `--version` reports GROVE_VERSION, injected from the tag at release time — so
# there is no second number to keep in step with the first.
edition = "2024"
description = "A file tree pinned to one root, with live previews, in a single herdr pane"
authors = ["Steven Borrie"]
repository = "https://github.com/saborrie/grove"
readme = "README.md"
keywords = ["tui", "file-manager", "herdr", "preview"]
# let-chains and edition 2024; cargo then explains a too-old toolchain instead
# of failing with a syntax error.
rust-version = "1.88"
license = "MIT"

[[bin]]
name = "grove"
path = "src/main.rs"

# The release workflow's version calculator. Behind a feature so that
# `cargo install --git` builds grove and only grove: a target whose
# required-features are absent is skipped, not built and installed.
[[bin]]
name = "next-version"
path = "src/bin/next_version.rs"
required-features = ["ci"]

[features]
# CI-only tooling, never enabled for a normal build.
ci = []

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
unicode-width = "0.2"

# Same highlighting stack the herdr-sidebar preview uses: pure-Rust regex engine,
# bat's extended grammar set on top of syntect's defaults.
syntect = { version = "5", default-features = false, features = [
    "parsing", "default-themes", "dump-load", "regex-fancy",
] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }

# Thumbnailing for the media preview. ffmpeg covers everything this misses.
image = { version = "0.25", default-features = false, features = [
    "png", "jpeg", "gif", "webp", "bmp", "tiff",
] }

# Talking to herdr's pane graphics API over its unix socket.
serde_json = "1"
base64 = "0.22"

[profile.release]
opt-level = 2
# Smaller, faster binaries for the release tarballs; the build is short enough
# that one codegen unit and thin LTO cost nothing worth measuring.
lto = "thin"
codegen-units = 1
strip = true
